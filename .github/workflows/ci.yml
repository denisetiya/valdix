name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:esm
      - run: npm run test:cjs
      - run: npm run test:e2e
      - run: npm run size
      - run: npm --prefix docs ci
      - run: npm run docs:build
      - name: E2E examples (consumer smoke)
        run: |
          for f in examples/*.mjs; do
            echo "--- $f ---"
            node "$f" > /dev/null
          done
